<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="615" viewBox="0 0 1120 615" role="img" aria-labelledby="t d"><title id="t">Live feedback, personal calibration, upper-body geometry checks, session counters, static hosting and browser-side camera processing.</title><desc id="d">Live feedback, personal calibration, upper-body geometry checks, session counters, static hosting and browser-side camera processing. Conceptual landmark illustration, not a camera screenshot or a medical assessment.</desc><style>@keyframes blink{50%{opacity:.3}}.blink{animation:blink 5s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.blink,.point,.links{animation:none!important}}@keyframes links{0%,100%{d:path("M0 -100L-20 -117M0 -100L20 -117M-20 -117L-42 -100M20 -117L42 -100M-42 -100L-100 15M42 -100L100 15M-100 15L100 15")}35%{d:path("M0 -70L-20 -87M0 -70L20 -87M-20 -87L-42 -70M20 -87L42 -70M-42 -70L-100 15M42 -70L100 15M-100 15L100 15")}70%{d:path("M24 -91L4 -108M24 -91L44 -108M4 -108L-18 -91M44 -108L66 -91M-18 -91L-100 8M66 -91L100 22M-100 8L100 22")}}.links{animation:links 12s ease-in-out infinite}@keyframes point0{0%,100%{transform:translate(0px,0px)}35%{transform:translate(0px,30px)}70%{transform:translate(24px,9px)}}.p0{animation:point0 12s ease-in-out infinite}@keyframes point1{0%,100%{transform:translate(0px,0px)}35%{transform:translate(0px,30px)}70%{transform:translate(24px,9px)}}.p1{animation:point1 12s ease-in-out infinite}@keyframes point2{0%,100%{transform:translate(0px,0px)}35%{transform:translate(0px,30px)}70%{transform:translate(24px,9px)}}.p2{animation:point2 12s ease-in-out infinite}@keyframes point3{0%,100%{transform:translate(0px,0px)}35%{transform:translate(0px,30px)}70%{transform:translate(24px,9px)}}.p3{animation:point3 12s ease-in-out infinite}@keyframes point4{0%,100%{transform:translate(0px,0px)}35%{transform:translate(0px,30px)}70%{transform:translate(24px,9px)}}.p4{animation:point4 12s ease-in-out infinite}@keyframes point5{0%,100%{transform:translate(0px,0px)}35%{transform:translate(0px,0px)}70%{transform:translate(0px,-7px)}}.p5{animation:point5 12s ease-in-out infinite}@keyframes point6{0%,100%{transform:translate(0px,0px)}35%{transform:translate(0px,0px)}70%{transform:translate(0px,7px)}}.p6{animation:point6 12s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.point,.links{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="522" height="185" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(44 32) scale(0.9090909090909091)"><path d="M22 3a6 6 0 1 0 0 12a6 6 0 1 0 0-12M6 24l16-7 16 7M22 17v13M22 30L10 42M22 30l12 12" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="102" y="61" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="600" fill="#F3D962" >LIVE FEEDBACK</text><text x="46" y="114" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >Upright, slouching and lateral-lean</text><text x="46" y="148" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >states.</text><rect x="574" y="12" width="522" height="185" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(594 32) scale(0.9090909090909091)"><path d="M5 8v30h35M10 30l10-14 9 8 9-16M10 22h30" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="652" y="61" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="600" fill="#F3D962" >YOUR BASELINE</text><text x="596" y="114" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >Calibrate using your current upright</text><text x="596" y="148" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >pose.</text><rect x="24" y="212" width="522" height="185" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(44 232) scale(0.9090909090909091)"><path d="M22 3l17 8v13q0 11-17 18Q5 35 5 24V11zM13 23l7 7 12-16" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="102" y="261" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="600" fill="#F3D962" >GEOMETRY CHECKS</text><text x="46" y="314" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >Reject incomplete or implausible</text><text x="46" y="348" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >upper-body detections.</text><rect x="574" y="212" width="522" height="185" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(594 232) scale(0.9090909090909091)"><path d="M16 3h12M22 3v7M22 12a14 14 0 1 0 0 28a14 14 0 1 0 0-28M22 18v10l7 4" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="652" y="261" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="600" fill="#F3D962" >SESSION COUNTERS</text><text x="596" y="314" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >Track session time, slouch events</text><text x="596" y="348" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >and lean events.</text><rect x="24" y="412" width="522" height="185" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(44 432) scale(0.9090909090909091)"><path d="M4 6h36v34H4zM4 15h36M10 10h1M16 10h1M22 10h1" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="102" y="461" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="600" fill="#F3D962" >STATIC WEB APP</text><text x="46" y="514" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >No application server or user</text><text x="46" y="548" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >account required.</text><rect x="574" y="412" width="522" height="185" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(594 432) scale(0.9090909090909091)"><path d="M4 12h9l4-7h11l4 7h9v28H4zM22 19a8 8 0 1 0 0 16a8 8 0 1 0 0-16" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="652" y="461" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="600" fill="#F3D962" >BROWSER PROCESSING</text><text x="596" y="514" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >Camera frames are not uploaded by</text><text x="596" y="548" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#BCFCF6" >this project.</text></svg>