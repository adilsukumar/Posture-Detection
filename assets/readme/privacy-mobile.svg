<svg xmlns="http://www.w3.org/2000/svg" width="640" height="615" viewBox="0 0 640 615" role="img" aria-labelledby="t d"><title id="t">Camera frames stay in the browser for this project. Public CDNs supply MediaPipe and fonts. The reference CSV is not training data for the browser classifier.</title><desc id="d">Camera frames stay in the browser for this project. Public CDNs supply MediaPipe and fonts. The reference CSV is not training data for the browser classifier. Conceptual landmark illustration, not a camera screenshot or a medical assessment.</desc><style>@keyframes blink{50%{opacity:.3}}.blink{animation:blink 5s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.blink,.point,.links{animation:none!important}}@keyframes links{0%,100%{d:path("M0 -100L-20 -117M0 -100L20 -117M-20 -117L-42 -100M20 -117L42 -100M-42 -100L-100 15M42 -100L100 15M-100 15L100 15")}35%{d:path("M0 -70L-20 -87M0 -70L20 -87M-20 -87L-42 -70M20 -87L42 -70M-42 -70L-100 15M42 -70L100 15M-100 15L100 15")}70%{d:path("M24 -91L4 -108M24 -91L44 -108M4 -108L-18 -91M44 -108L66 -91M-18 -91L-100 8M66 -91L100 22M-100 8L100 22")}}.links{animation:links 12s ease-in-out infinite}@keyframes point0{0%,100%{transform:translate(0px,0px)}35%{transform:translate(0px,30px)}70%{transform:translate(24px,9px)}}.p0{animation:point0 12s ease-in-out infinite}@keyframes point1{0%,100%{transform:translate(0px,0px)}35%{transform:translate(0px,30px)}70%{transform:translate(24px,9px)}}.p1{animation:point1 12s ease-in-out infinite}@keyframes point2{0%,100%{transform:translate(0px,0px)}35%{transform:translate(0px,30px)}70%{transform:translate(24px,9px)}}.p2{animation:point2 12s ease-in-out infinite}@keyframes point3{0%,100%{transform:translate(0px,0px)}35%{transform:translate(0px,30px)}70%{transform:translate(24px,9px)}}.p3{animation:point3 12s ease-in-out infinite}@keyframes point4{0%,100%{transform:translate(0px,0px)}35%{transform:translate(0px,30px)}70%{transform:translate(24px,9px)}}.p4{animation:point4 12s ease-in-out infinite}@keyframes point5{0%,100%{transform:translate(0px,0px)}35%{transform:translate(0px,0px)}70%{transform:translate(0px,-7px)}}.p5{animation:point5 12s ease-in-out infinite}@keyframes point6{0%,100%{transform:translate(0px,0px)}35%{transform:translate(0px,0px)}70%{transform:translate(0px,7px)}}.p6{animation:point6 12s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.point,.links{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="592" height="185" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(44 34) scale(0.9090909090909091)"><path d="M4 12h9l4-7h11l4 7h9v28H4zM22 19a8 8 0 1 0 0 16a8 8 0 1 0 0-16" fill="none" stroke="#A783F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="61" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="600" fill="#F3D962" >CAMERA FRAMES</text><text x="46" y="118" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#F8F8F3" >This project does not transmit or store</text><text x="46" y="152" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#F8F8F3" >camera frames.</text><rect x="24" y="212" width="592" height="185" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(44 234) scale(0.9090909090909091)"><path d="M4 6h36v34H4zM4 15h36M10 10h1M16 10h1M22 10h1" fill="none" stroke="#A783F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="261" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="600" fill="#F3D962" >EXTERNAL ASSETS</text><text x="46" y="318" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#F8F8F3" >MediaPipe and fonts load from public CDNs;</text><text x="46" y="352" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#F8F8F3" >first load needs internet.</text><rect x="24" y="412" width="592" height="185" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(44 434) scale(0.9090909090909091)"><path d="M5 10q17-11 34 0v25q-17 11-34 0zM5 10q17 11 34 0M5 22q17 11 34 0" fill="none" stroke="#A783F7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="101" y="461" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="600" fill="#F3D962" >REFERENCE DATA</text><text x="46" y="518" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#F8F8F3" >The CSV schema differs from the live</text><text x="46" y="552" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#F8F8F3" >features. It is not the browser</text><text x="46" y="586" font-family="Bahnschrift, Arial, sans-serif" font-size="25" font-weight="400" fill="#F8F8F3" >classifier’s training data.</text></svg>