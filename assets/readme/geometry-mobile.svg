<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" role="img" aria-labelledby="t d"><title id="t">f1 equals ten times the absolute difference between left and right face-centre-to-shoulder distances divided by shoulder width. f2 equals the sum of those distances divided by shoulder width.</title><desc id="d">f1 equals ten times the absolute difference between left and right face-centre-to-shoulder distances divided by shoulder width. f2 equals the sum of those distances divided by shoulder width. Conceptual landmark illustration, not a camera screenshot or a medical assessment.</desc><style>@keyframes blink{50%{opacity:.3}}.blink{animation:blink 5s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.blink,.point,.links{animation:none!important}}@keyframes links{0%,100%{d:path("M0 -100L-20 -117M0 -100L20 -117M-20 -117L-42 -100M20 -117L42 -100M-42 -100L-100 15M42 -100L100 15M-100 15L100 15")}35%{d:path("M0 -70L-20 -87M0 -70L20 -87M-20 -87L-42 -70M20 -87L42 -70M-42 -70L-100 15M42 -70L100 15M-100 15L100 15")}70%{d:path("M24 -91L4 -108M24 -91L44 -108M4 -108L-18 -91M44 -108L66 -91M-18 -91L-100 8M66 -91L100 22M-100 8L100 22")}}.links{animation:links 12s ease-in-out infinite}@keyframes point0{0%,100%{transform:translate(0px,0px)}35%{transform:translate(0px,30px)}70%{transform:translate(24px,9px)}}.p0{animation:point0 12s ease-in-out infinite}@keyframes point1{0%,100%{transform:translate(0px,0px)}35%{transform:translate(0px,30px)}70%{transform:translate(24px,9px)}}.p1{animation:point1 12s ease-in-out infinite}@keyframes point2{0%,100%{transform:translate(0px,0px)}35%{transform:translate(0px,30px)}70%{transform:translate(24px,9px)}}.p2{animation:point2 12s ease-in-out infinite}@keyframes point3{0%,100%{transform:translate(0px,0px)}35%{transform:translate(0px,30px)}70%{transform:translate(24px,9px)}}.p3{animation:point3 12s ease-in-out infinite}@keyframes point4{0%,100%{transform:translate(0px,0px)}35%{transform:translate(0px,30px)}70%{transform:translate(24px,9px)}}.p4{animation:point4 12s ease-in-out infinite}@keyframes point5{0%,100%{transform:translate(0px,0px)}35%{transform:translate(0px,0px)}70%{transform:translate(0px,-7px)}}.p5{animation:point5 12s ease-in-out infinite}@keyframes point6{0%,100%{transform:translate(0px,0px)}35%{transform:translate(0px,0px)}70%{transform:translate(0px,7px)}}.p6{animation:point6 12s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.point,.links{animation:none!important}}</style><rect width="100%" height="100%" fill="#0E1116"/><rect x="24" y="12" width="592" height="295" rx="18" fill="#141320" stroke="#343044"/><g transform="translate(46 38) scale(1.0454545454545454)"><path d="M6 35L22 5l17 30zM6 35h33M22 5v30M16 35v-6h6" fill="none" stroke="#FF4081" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="111" y="72" font-family="Bahnschrift, Arial, sans-serif" font-size="28" font-weight="600" fill="#F8F8F3" >TWO FEATURES. ONE BASELINE.</text><text x="46" y="137" font-family="Bahnschrift, Arial, sans-serif" font-size="32" font-weight="600" fill="#F3D962" >f1  =  10 × |L − R| / W</text><text x="46" y="192" font-family="Bahnschrift, Arial, sans-serif" font-size="32" font-weight="600" fill="#BCFCF6" >f2  =  (L + R) / W</text><text x="46" y="249" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" fill="#A783F7" >L and R: face-centre-to-shoulder</text><text x="46" y="280" font-family="Bahnschrift, Arial, sans-serif" font-size="23" font-weight="400" fill="#A783F7" >distances. W: shoulder width.</text></svg>